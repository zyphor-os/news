<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News — Zyphor OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Source+Serif+4:wght@400;600&display=swap">
<link rel="stylesheet" href="news.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html">Zyphor OS News</a>
  <a class="here" href="index.html">News</a>
  <a class="here" href="https://zyphor-os.github.io">Back To Website</a>
</header>
<main>
  <h1 class="page-title">News</h1>
  <p class="lede">Releases, guides and community updates.</p>
  <section id="featured"></section>
  <section id="grid" class="grid"></section>
  <p id="status" role="status">Loading news…</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
$(function () {
  function fmt(d) {
    return new Date(d).toLocaleDateString('en', {year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'});
  }

  function initials(name) {
    return $('<span class="avatar avatar-fallback" aria-hidden="true">')
      .text(String(name || '?').split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join('').toUpperCase());
  }

  function cover(n, lazy) {
    var $img = $('<img class="cover">').attr({alt: n.title, loading: lazy ? 'lazy' : 'eager'});
    $img.on('error', function () { $(this).replaceWith($('<div class="cover cover-missing" role="img">').attr('aria-label', n.title)); });
    return $img.attr('src', n.featuredImage || '').each(function () {
      if (!n.featuredImage) { $(this).trigger('error'); }
    });
  }

  function byline(n) {
    var $b = $('<span class="byline">');
    if (n.authorImage) {
      $('<img class="avatar">').attr({src: n.authorImage, alt: '', width: 40, height: 40})
        .on('error', function () { $(this).replaceWith(initials(n.author)); }).appendTo($b);
    } else {
      initials(n.author).appendTo($b);
    }
    var $t = $('<span class="by">').appendTo($b);
    $('<strong class="by-name">').text(n.author).appendTo($t);
    $('<span class="by-date">').text('Posted ' + fmt(n.date)).appendTo($t);
    return $b;
  }

  function story(n, lead) {
    var $a = $('<a class="story reveal">').toggleClass('lead', !!lead)
      .attr('href', 'news-details.html?id=' + encodeURIComponent(n.id));
    cover(n, !lead).appendTo($a);
    var $t = $('<div class="txt">').appendTo($a);
    $('<span class="tag">').text(n.category).appendTo($t);
    $(lead ? '<h2>' : '<h3>').text(n.title).appendTo($t);
    $('<p>').text(n.summary).appendTo($t);
    byline(n).appendTo($t);
    return $a;
  }

  $.getJSON('news.json').done(function (data) {
    var items = (data.news || []).slice().sort(function (a, b) {
      var diff = new Date(b.date) - new Date(a.date);
      return diff !== 0 ? diff : String(b.id).localeCompare(String(a.id));
    });
    if (!items.length) { $('#status').text('No news yet. Add items to news.json.'); return; }
    $('#featured').append(story(items[0], true));
    $.each(items.slice(1), function (i, n) { $('#grid').append(story(n, false)); });
    $('#status').remove();
    $('.reveal').each(function (i) {
      var $el = $(this);
      setTimeout(function () { $el.addClass('in'); }, 120 + i * 140);
    });
  }).fail(function () {
    $('#status').text('Could not load news.json. Serve this folder over http (not file://) and check the file name.');
  });
});
</script>
</body>
</html>
